    <title>TopoRisk 智慧登山風險評估 (真實地形版 - 含越野修正)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f766e;
            --primary-hover: #115e59;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --danger: #ef4444;
            --warning: #f59e0b;
            --safe: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        header { background: linear-gradient(135deg, #0f766e 0%, #0369a1 100%); color: white; padding: 40px 20px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        header h1 { font-size: 2.2rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px; }
        header p { font-size: 1.1rem; opacity: 0.9; font-weight: 400; }
        
        .container { max-width: 800px; margin: -30px auto 40px auto; padding: 0 20px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 30px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); margin-bottom: 25px; }
        .card-title { font-size: 1.2rem; font-weight: 700; color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
        .input-group input[type="number"] { padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; transition: all 0.3s; }
        .input-group input[type="number"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.2); }
        .checkbox-wrapper { display: flex; align-items: center; height: 100%; gap: 10px; padding: 10px 0; }
        .checkbox-wrapper input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }
        .checkbox-wrapper span { font-weight: 700; color: var(--text-main); font-size: 0.95rem; }

        .btn { width: 100%; padding: 15px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; margin-top: 20px; box-shadow: 0 4px 6px -1px rgba(15, 118, 110, 0.4); }
        .btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        
        #result-section { display: none; }
        .result-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-box { background: #f1f5f9; padding: 20px; border-radius: 10px; text-align: center; }
        .stat-box span { display: block; font-size: 0.9rem; color: var(--text-muted); font-weight: 700;}
        .stat-box strong { display: block; font-size: 1.5rem; color: var(--text-main); margin-top: 5px; }
        
        .alert { padding: 20px; border-radius: 8px; font-weight: 700; display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .alert-safe { background-color: #d1fae5; color: #065f46; border-left: 5px solid var(--safe); }
        
        .tech-note { font-size: 0.85rem; color: var(--text-muted); background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px dashed #cbd5e1; }
        @media (max-width: 600px) { .input-grid, .result-stats { grid-template-columns: 1fr; } }
    </style>
</head>

            <div class="tech-note">
                <b>🔬 核心運算更新說明：</b><br>
                本系統已完美整合 Python 版本的 <b>Tobler's Hiking Function 模組</b>。系統自動計算兩點間的高度差與坡度後，會根據「越野修正係數 (0.6)」進行路面降速補償，提供更貼近真實百岳地形的預估時間。
            </div>
        </div>

         * 結合 Python 邏輯的 Tobler 速度計算函數
         * @param {number} slope - 地形坡度 (dh/dx)
         * @param {boolean} isOffRoad - 是否為越野環境
         * @returns {number} 估算的步行速度 (km/h)
         */
        function calculateToblerSpeed(slope, isOffRoad = false) {
            const baseConstant = 6.0; // 固定以 km/h 為基準
            let baseSpeed = baseConstant * Math.exp(-3.5 * Math.abs(slope + 0.05));
            let correctionFactor = isOffRoad ? 0.6 : 1.0;
            return baseSpeed * correctionFactor;
        }
